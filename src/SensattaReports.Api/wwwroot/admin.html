<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensatta Reports — Painel</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --line:#dcdfe4; --ink:#1c2430; --muted:#6b7482;
            --brand:#8b1a1a; --ok:#1c7c4a; --okbg:#e6f4ec; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--brand); color:#fff; padding:14px 20px; font-size:18px; font-weight:700; }
    .wrap { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; align-items:start; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
    h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 12px; }
    input[type=text], textarea, select { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
    textarea { min-height:180px; font-family:ui-monospace,Consolas,monospace; font-size:13px; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
    button.primary { background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600; }
    button:hover { filter:brightness(.97); }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .catalog { max-height:70vh; overflow:auto; }
    .item { padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
    .item:hover { border-color:var(--brand); }
    .item.sel { border-color:var(--brand); background:#fbeeee; }
    .item .cod { color:var(--muted); font-size:12px; }
    .badge { font-size:11px; padding:1px 7px; border-radius:10px; background:var(--okbg); color:var(--ok); font-weight:700; }
    table { width:100%; border-collapse:collapse; margin-top:6px; }
    th,td { text-align:left; padding:4px; border-bottom:1px solid var(--line); font-size:13px; }
    th { color:var(--muted); font-weight:600; }
    .msg { padding:8px 12px; border-radius:6px; margin-top:12px; display:none; }
    .msg.ok { background:var(--okbg); color:var(--ok); display:block; }
    .msg.err { background:#fdecec; color:#b02a2a; display:block; }
    .hint { color:var(--muted); font-size:12px; }
  </style>
</head>
<body>
  <header>Sensatta Reports — Painel de relatórios</header>
  <div class="wrap">

    <!-- Catalogo -->
    <div class="card">
      <h2>Catálogo (SIGMA.REPORT)</h2>
      <input type="text" id="filtro" placeholder="Filtrar..." oninput="render()">
      <div class="hint" style="margin:6px 0">Clique para carregar. <span class="badge">ativo</span> = já importado.</div>
      <div class="catalog" id="catalogo"></div>
      <button onclick="carregarCatalogo()" style="margin-top:8px">↻ Recarregar</button>
    </div>

    <!-- Editor -->
    <div class="card">
      <h2>Report</h2>

      <label>Nome (catálogo)</label>
      <input type="text" id="nome" readonly>

      <label>Código (URL / pasta)</label>
      <input type="text" id="codigo" placeholder="ex.: resumo-coletas-eua">

      <label>SQL (com binds :nome)</label>
      <textarea id="sql" placeholder="SELECT ... WHERE data &gt;= :data_ini AND data &lt;= :data_fim ..."></textarea>

      <div class="row" style="margin-top:8px">
        <button onclick="detectar()">🔍 Detectar parâmetros do SQL</button>
        <button onclick="addParam()">+ Parâmetro</button>
      </div>

      <table id="params">
        <thead><tr><th>Bind</th><th>Tipo</th><th>Obrig.</th><th>Rótulo</th><th></th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="row" style="margin-top:14px">
        <button class="primary" onclick="salvar()">💾 Salvar / Importar</button>
      </div>

      <div id="msg" class="msg"></div>

      <!-- Teste -->
      <div id="teste" style="display:none; margin-top:18px; border-top:1px solid var(--line); padding-top:14px">
        <h2>Testar</h2>
        <div id="testeParams"></div>
        <div class="row" style="margin-top:10px">
          <button onclick="gerar('pdf')">📄 Gerar PDF</button>
          <button onclick="gerar('xlsx')">📊 Gerar Excel</button>
        </div>
      </div>
    </div>
  </div>

<script>
const TIPOS = ["String","Integer","Decimal","Date","DateTime"];
let catalogo = [];
let selecionado = null;

async function carregarCatalogo() {
  try {
    const r = await fetch('/admin/api/catalog');
    catalogo = r.ok ? await r.json() : [];
  } catch { catalogo = []; }
  render();
}

function render() {
  const f = (document.getElementById('filtro').value || '').toLowerCase();
  const box = document.getElementById('catalogo');
  box.innerHTML = '';
  catalogo.filter(i => i.name.toLowerCase().includes(f) || i.codigo.includes(f)).forEach(i => {
    const d = document.createElement('div');
    d.className = 'item' + (selecionado === i.codigo ? ' sel' : '');
    d.onclick = () => selecionar(i);
    d.innerHTML = `<div class="row" style="justify-content:space-between">
        <strong>${esc(i.name)}</strong>${i.imported ? '<span class="badge">ativo</span>' : ''}</div>
      <div class="cod">${esc(i.codigo)}</div>`;
    box.appendChild(d);
  });
}

async function selecionar(item) {
  selecionado = item.codigo;
  document.getElementById('nome').value = item.name;
  document.getElementById('codigo').value = item.codigo;
  document.getElementById('sql').value = '';
  setParams([]);
  esconderTeste();
  // se ja importado, carrega SQL e parametros salvos
  if (item.imported) {
    try {
      const r = await fetch('/admin/api/reports/' + encodeURIComponent(item.codigo));
      if (r.ok) { const d = await r.json(); document.getElementById('sql').value = d.sql || ''; setParams(d.parametros || []); }
    } catch {}
  }
  render();
}

async function detectar() {
  const sql = document.getElementById('sql').value;
  const r = await fetch('/admin/api/detect-binds', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sql })
  });
  if (r.ok) setParams(await r.json());
}

function setParams(list) {
  const tb = document.querySelector('#params tbody');
  tb.innerHTML = '';
  (list || []).forEach(p => addParam(p));
}

function addParam(p) {
  p = p || { name:'', type:'String', required:true, label:'' };
  const tb = document.querySelector('#params tbody');
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="p-name" value="${esc(p.name)}"></td>
    <td><select class="p-type">${TIPOS.map(t => `<option ${t===p.type?'selected':''}>${t}</option>`).join('')}</select></td>
    <td style="text-align:center"><input type="checkbox" class="p-req" ${p.required?'checked':''}></td>
    <td><input type="text" class="p-label" value="${esc(p.label||'')}"></td>
    <td><button onclick="this.closest('tr').remove()">✕</button></td>`;
  tb.appendChild(tr);
}

function lerParams() {
  return [...document.querySelectorAll('#params tbody tr')].map(tr => ({
    name: tr.querySelector('.p-name').value.trim(),
    type: tr.querySelector('.p-type').value,
    required: tr.querySelector('.p-req').checked,
    label: tr.querySelector('.p-label').value.trim()
  })).filter(p => p.name);
}

async function salvar() {
  const body = {
    name: document.getElementById('nome').value,
    codigo: document.getElementById('codigo').value.trim(),
    sql: document.getElementById('sql').value,
    parametros: lerParams()
  };
  const r = await fetch('/admin/api/reports', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    msg('Salvo! Disponível em ' + d.url, true);
    selecionado = d.codigo;
    mostrarTeste(d.codigo);
    carregarCatalogo();
  } else {
    msg('Erro: ' + (d.error || r.status), false);
  }
}

function mostrarTeste(codigo) {
  const box = document.getElementById('testeParams');
  box.dataset.codigo = codigo;
  box.innerHTML = lerParams().map(p =>
    `<label>${esc(p.label || p.name)} <span class="hint">(${p.name}${p.required?', obrigatório':''})</span></label>
     <input type="text" class="t-in" data-name="${esc(p.name)}" placeholder="${p.type==='Date'?'2026-10-20':''}">`).join('');
  document.getElementById('teste').style.display = 'block';
}
function esconderTeste() { document.getElementById('teste').style.display = 'none'; }

function gerar(fmt) {
  const codigo = document.getElementById('testeParams').dataset.codigo;
  const qs = [...document.querySelectorAll('#testeParams .t-in')]
    .filter(i => i.value.trim() !== '')
    .map(i => encodeURIComponent(i.dataset.name) + '=' + encodeURIComponent(i.value.trim())).join('&');
  window.open('/reports/' + encodeURIComponent(codigo) + '/' + fmt + (qs ? '?' + qs : ''), '_blank');
}

function msg(text, ok) {
  const m = document.getElementById('msg');
  m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

carregarCatalogo();
</script>
</body>
</html>
